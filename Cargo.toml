[package]
name = "lazygtd"
version = "0.1.0-preview.8"
edition = "2024"
rust-version = "1.89"
description = "A local-first GTD terminal desk"
license = "MIT"
repository = "https://github.com/Lettuce222/lazygtd"
publish = false

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm","unstable-rendered-line-info"] }
crossterm = "=0.29.0"
flate2 = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"
