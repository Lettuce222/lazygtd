name: Build and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  queue: max

jobs:
  release-plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the Cargo version
        run: cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
      - name: Allocate the release tag for this main commit
        id: version
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > published-tags
          git for-each-ref --format='%(refname:short)%09%(objectname)%09%(*objectname)' refs/tags > tag-refs
          tag=$(python3 .github/scripts/release_plan.py plan cargo-metadata.json published-tags tag-refs "$RELEASE_SHA")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting and lint
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          python3 -m unittest discover -s .github/scripts -p test_release_plan.py

  build:
    needs: [release-plan]
    if: ${{ !cancelled() && (needs.release-plan.result == 'success' || needs.release-plan.result == 'skipped') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
          # Temporary fallback while the native Apple Silicon pool is unavailable.
          - runner: macos-15-intel
            platform: macos-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      TAG: ${{ needs.release-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the allocated Cargo version
        if: needs.release-plan.outputs.tag != ''
        shell: bash
        run: python .github/scripts/release_plan.py stamp "$TAG"
      - name: Test and build native Unix
        if: runner.os != 'Windows' && matrix.platform != 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "$BUILD_TARGET"
          cargo test --locked --target "$BUILD_TARGET"
          cargo build --release --locked --target "$BUILD_TARGET"
      - name: Cross-compile Apple Silicon on Intel
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          rustup target add "$BUILD_TARGET"
          cargo test --locked --no-run --target "$BUILD_TARGET"
          cargo build --release --locked --target "$BUILD_TARGET"
          test "$(lipo -archs "target/$BUILD_TARGET/release/lazygtd")" = arm64
      - name: Test and build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup target add $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test and package release Unix build
        if: runner.os != 'Windows' && matrix.platform != 'macos-arm64' && needs.release-plan.outputs.tag != ''
        shell: bash
        run: python3 .github/scripts/package.py --tag "$TAG" --platform "$PLATFORM" --target "$BUILD_TARGET"
      - name: Verify architecture and package release Apple Silicon build
        if: matrix.platform == 'macos-arm64' && needs.release-plan.outputs.tag != ''
        shell: bash
        run: python3 .github/scripts/package.py --tag "$TAG" --platform "$PLATFORM" --target "$BUILD_TARGET" --cross-apple-silicon
      - name: Smoke test and package release Windows build
        if: runner.os == 'Windows' && needs.release-plan.outputs.tag != ''
        shell: pwsh
        run: python .github/scripts/package.py --tag $env:TAG --platform $env:PLATFORM --target $env:BUILD_TARGET
      - name: Keep checked binaries from branch builds
        if: needs.release-plan.outputs.tag == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          name=lazygtd
          if [[ "$PLATFORM" == windows-* ]]; then name=lazygtd.exe; fi
          cp "target/$BUILD_TARGET/release/$name" LICENSE dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && needs.release-plan.outputs.tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [release-plan, lint, build]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        env:
          TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]
          sha256sum -- \
            "lazygtd-$TAG-linux-x86_64.tar.gz" "lazygtd-$TAG-linux-aarch64.tar.gz" \
            "lazygtd-$TAG-macos-arm64.tar.gz" "lazygtd-$TAG-macos-x86_64.tar.gz" \
            "lazygtd-$TAG-windows-x86_64.zip" "lazygtd-$TAG-windows-arm64.zip" > SHA256SUMS
      - name: Attest signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - name: Publish checked GitHub Release
        working-directory: dist
        env:
          TAG: ${{ needs.release-plan.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum -c --strict SHA256SUMS
          mapfile -t assets < <(cut -d ' ' -f 3 SHA256SUMS)
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="https://github.com/$GH_REPO.git"
          if refs=$(git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" "refs/tags/$TAG^{}"); then
            object=$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }' <<< "$refs")
            if [[ -z "$object" ]]; then
              object=$(awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }' <<< "$refs")
            fi
            [[ "$object" == "$RELEASE_SHA" ]] || { echo "Existing $TAG points to a different commit" >&2; exit 1; }
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$RELEASE_SHA" --silent
          fi
          flags=()
          if [[ "$TAG" == *-preview.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${assets[@]}" SHA256SUMS \
            --verify-tag "${flags[@]}" --title "lazygtd $TAG" \
            --notes 'Includes builds with bundled SQLite, SHA256SUMS and GitHub build provenance. The Apple Silicon build was cross-compiled on Intel, checked for arm64 architecture and its test targets compiled, but was not executed on Apple Silicon. Other release targets were tested natively. The executables are not OS-signed or notarized.'
